<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description" preserveAspectRatio="xMidYMid meet">
  <title id="title">PhishGuard public workflow</title>
  <desc id="description">A five-stage workflow showing URL submission, validation, protected assessment, summary generation, and result presentation with optional private history.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F12"/>
      <stop offset="1" stop-color="#0D1512"/>
    </linearGradient>
    <linearGradient id="protectedFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12331F"/>
      <stop offset="1" stop-color="#0E2919"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#22C55E" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="24" fill="url(#background)" stroke="#1D2A24" stroke-width="2"/>

  <text x="32" y="39" fill="#4ADE80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">PUBLIC WORKFLOW</text>
  <text x="1168" y="39" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="end">Core analysis remains private</text>

  <path d="M220 127H246" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M440 127H466" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M680 127H706" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M930 127H956" fill="none" stroke="#22C55E" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="30" y="78" width="190" height="98" rx="18" fill="#111820" stroke="#22C55E" stroke-width="2"/>
    <circle cx="55" cy="102" r="10" fill="#163522" stroke="#22C55E"/>
    <text x="55" y="106" fill="#4ADE80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">01</text>
    <text x="74" y="106" fill="#7EE2A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">INPUT</text>
    <text x="125" y="145" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle">Submit URL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="78" width="190" height="98" rx="18" fill="#111820" stroke="#64748B" stroke-width="2"/>
    <circle cx="275" cy="102" r="10" fill="#202A36" stroke="#64748B"/>
    <text x="275" y="106" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">02</text>
    <text x="294" y="106" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">VALIDATE</text>
    <text x="345" y="145" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle">Check &amp; Prepare</text>
  </g>

  <g filter="url(#greenGlow)">
    <rect x="470" y="70" width="210" height="114" rx="20" fill="url(#protectedFill)" stroke="#4ADE80" stroke-width="3"/>
    <circle cx="497" cy="97" r="11" fill="#22C55E"/>
    <text x="497" y="101" fill="#07110B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle">03</text>
    <text x="518" y="101" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">ASSESS</text>
    <text x="575" y="140" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Protected Analysis</text>
    <text x="575" y="161" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Private processing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="78" width="220" height="98" rx="18" fill="#111820" stroke="#22C55E" stroke-width="2"/>
    <circle cx="735" cy="102" r="10" fill="#163522" stroke="#22C55E"/>
    <text x="735" y="106" fill="#4ADE80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">04</text>
    <text x="754" y="106" fill="#7EE2A2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">SUMMARIZE</text>
    <text x="820" y="139" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="middle">Score · Verdict</text>
    <text x="820" y="159" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Security indicators</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="78" width="210" height="98" rx="18" fill="#0F2418" stroke="#4ADE80" stroke-width="2"/>
    <circle cx="985" cy="102" r="10" fill="#22C55E"/>
    <text x="985" y="106" fill="#07110B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" text-anchor="middle">05</text>
    <text x="1004" y="106" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">PRESENT</text>
    <text x="1065" y="139" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="middle">Display Result</text>
    <text x="1065" y="159" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">Optional private history</text>
  </g>

  <text x="600" y="216" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">URL input  →  validation  →  protected assessment  →  security summary  →  user result</text>
</svg>
